name: Poll GBFS feeds

on:
  schedule:
    # Every 10 minutes, offset from the top of the hour. GitHub's scheduler is
    # busiest at :00 and jobs queued then are the likeliest to be delayed or
    # dropped. Starting at :03 costs nothing and loses fewer runs.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:        # adds a "Run workflow" button for testing

permissions:
  contents: write           # the job commits data back into this repository

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Metro Bike Share
        run: >
          python gbfs_poll.py
          --url https://gbfs.bcycle.com/bcycle_lametro/gbfs.json
          --system metro_bike_share

      # ---------------------------------------------------------------------
      # Dockless systems: leave these off until you actually want them.
      #
      # Docked feeds report one row per STATION (223). Dockless feeds report
      # one row per VEHICLE, which can be thousands. At 10-minute polling that
      # is roughly a hundred times more data, and it will outgrow a GitHub
      # repository in a few months. If you add them, poll them hourly instead
      # by putting them in a second workflow file with its own schedule.
      #
      # - name: Bird Los Angeles
      #   continue-on-error: true
      #   run: >
      #     python gbfs_poll.py
      #     --url https://mds.bird.co/gbfs/v2/public/los-angeles/gbfs.json
      #     --system bird_la
      # ---------------------------------------------------------------------

      - name: Commit new data
        run: |
          git config user.name "gbfs-poller"
          git config user.email "actions@github.com"
          git add data
          # "git commit" errors when nothing is staged, which would mark the
          # whole run as failed. Check before committing.
          if git diff --staged --quiet; then
            echo "no new data this run"
          else
            git commit -m "data: $(date -u '+%Y-%m-%d %H:%M UTC')"
            # Another run may have pushed while this one was working.
            git pull --rebase --autostash
            git push
          fi
